name: Publish Hugo content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/**"
      - "layouts/**"
      - "themes/**"
      - "config.yml"
      - ".github/workflows/publish-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hugo-content
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build the published site
        run: hugo --minify

      - name: Commit generated site files
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Publish Hugo site"
          file_pattern: docs
